[package]
name = "liq-l2-engine"
version = "0.1.0"
edition = "2024"
description = "Rust hot-loop engine for Tardis Binance Futures L2 slippage feature generation"

[dependencies]
anyhow = "1"
arrow = "58.3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
parquet = { version = "58.3", features = ["arrow"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
